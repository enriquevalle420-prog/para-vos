<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Vos 💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffe6eb 0%, #ffb6c1 50%, #ff8da1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.25);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 2px solid #ffccd5;
            position: relative;
        }
        h1 {
            color: #d81b60;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .carousel {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .slide {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .slide.active {
            display: block;
        }
        .slide img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 18px;
        }
        .caption {
            margin-top: 15px;
            color: #ad1457;
            font-size: 1.05rem;
            line-height: 1.5;
            font-weight: 600;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
        .btn {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            color: #d81b60;
            border: none;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
            user-select: none;
        }
        .btn:hover {
            background: #d81b60;
            color: white;
        }
        .prev { left: 10px; }
        .next { right: 10px; }
        
        .dots {
            margin-top: 12px;
        }
        .dot {
            height: 10px;
            width: 10px;
            margin: 0 4px;
            background-color: #ffccd5;
            border-radius: 50%;
            display: inline-block;
            transition: 0.3s;
        }
        .dot.active-dot {
            background-color: #d81b60;
            width: 22px;
            border-radius: 10px;
        }

        .hearts {
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hearts">💖✨</div>
        <h1>Un detalle para vos 🥰</h1>
        
        <div class="carousel">
            <!-- Foto 2 (Traje Verde) -->
            <div class="slide active">
                <img src="foto2.jpg" alt="Foto Verde">
                <div class="caption">¡A bailar se ha dicho! Y cada momento bonito es mejor a tu lado ✨💃🕺</div>
            </div>

            <!-- Foto 3 (Traje Morado) -->
            <div class="slide">
                <img src="foto3.jpg" alt="Foto Morada">
                <div class="caption">Hice esta página solo para recordarte lo mucho que me encantas a pesar de que vos no me soportes 🤭💖</div>
            </div>

            <!-- Botones para cambiar -->
            <button class="btn prev" onclick="moveSlide(-1)">❮</button>
            <button class="btn next" onclick="moveSlide(1)">❯</button>
        </div>

        <div class="dots">
            <span class="dot active-dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active-dot'));

            if (index >= slides.length) currentSlide = 0;
            if (index < 0) currentSlide = slides.length - 1;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active-dot');
        }

        function moveSlide(step) {
            currentSlide += step;
            showSlide(currentSlide);
        }
    </script>

</body>
</html>
